        # StartOS: OCR language data. Serve the bundled file when we ship it;
        # otherwise redirect to jsdelivr (upstream's own default source) so
        # every OCR language keeps working. Bundled languages are listed in
        # tesseract-langs.txt; @TESSDATA_VERSION@ is substituted at build time.
        location ^~ /tesseract/lang/ {
            try_files $uri @tessdata_cdn;
        }
        location @tessdata_cdn {
            rewrite ^/tesseract/lang/([^/]+)/(.*)$ https://cdn.jsdelivr.net/npm/@tesseract.js-data/$1@@TESSDATA_VERSION@/$2 redirect;
        }
